name: Source Quality

on:
  push:
    paths:
      - "src/**"
      - "tools/decomp_lint.py"
      - "tools/decomp_binary.py"
      - "tools/decomp_candidates.py"
      - "tools/decomp_dependencies.py"
      - "tools/decomp_discover.py"
      - "tools/decomp_evidence.py"
      - "tools/decomp_attempts.py"
      - "tools/decomp_throughput.py"
      - "tools/Resources/reconstruction-blockers.tsv"
      - "tools/Resources/scoreboard.tsv"
      - "tools/Resources/tooling-experiments.tsv"
      - "tools/Resources/function-discovery-exclusions.tsv"
      - "tools/generate-decomp-report.py"
      - "tools/tests/**"
      - ".notes/lint-baseline.tsv"
      - ".github/workflows/source-quality.yml"
  pull_request:
    paths:
      - "src/**"
      - "tools/decomp_lint.py"
      - "tools/decomp_binary.py"
      - "tools/decomp_candidates.py"
      - "tools/decomp_dependencies.py"
      - "tools/decomp_discover.py"
      - "tools/decomp_evidence.py"
      - "tools/decomp_attempts.py"
      - "tools/decomp_throughput.py"
      - "tools/Resources/reconstruction-blockers.tsv"
      - "tools/Resources/scoreboard.tsv"
      - "tools/Resources/tooling-experiments.tsv"
      - "tools/Resources/function-discovery-exclusions.tsv"
      - "tools/generate-decomp-report.py"
      - "tools/tests/**"
      - ".notes/lint-baseline.tsv"
      - ".github/workflows/source-quality.yml"
  workflow_dispatch:

jobs:
  lint-source:
    name: Lint reconstructed source
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run tooling tests
        run: python -m unittest discover -s tools/tests -v

      - name: Check source plausibility
        run: python tools/decomp_lint.py --quiet
